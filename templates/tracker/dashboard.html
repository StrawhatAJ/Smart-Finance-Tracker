<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Finance Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    <h1>Smart Finance Tracker</h1>

    <div class="container">
        <div class="card form-container">
            <h2>Add Transaction</h2>
            <form id="transaction-form">
                {% csrf_token %}
                <input type="text" id="description" placeholder="Description" required>
                <input type="number" step="0.01" id="amount" placeholder="Amount" required>
                <select id="category_id" aria-label="Category"></select>
                <select id="is_income" aria-label="Transaction Type">
                    <option value="false">Expense</option>
                    <option value="true">Income</option>
                </select>
                <button type="submit">Add</button>
            </form>
        </div>

        <div class="card summary">
            <h2>Summary</h2>
            <p id="summary">Loading...</p>
        </div>

        <div class="card chart-container">
            <h3>Expenses by Category</h3>
            <canvas id="pieChart"></canvas>
        </div>
        <div class="card chart-container">
            <h3>Monthly Expenses</h3>
            <canvas id="lineChart"></canvas>
        </div>

        <div class="card transactions">
            <h2>All Transactions</h2>
            <table id="transactions-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const apiBase = "/api/";
        let pieChartInstance = null;
        let lineChartInstance = null;

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        async function loadCategories() {
            try {
                const res = await fetch(apiBase + "categories/");
                if (!res.ok) throw new Error('Failed to fetch categories');
                const categories = await res.json();
                const categorySelect = document.getElementById("category_id");
                categorySelect.innerHTML = '<option value="">Select a Category</option>';
                categories.forEach(cat => {
                    const opt = document.createElement("option");
                    opt.value = cat.id;
                    opt.textContent = cat.name;
                    categorySelect.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
                alert("Could not load categories. Make sure they exist in the database.");
            }
        }

        async function deleteTransaction(transactionId) {
            if (!confirm('Are you sure you want to delete this transaction?')) return;
            await fetch(`${apiBase}transactions/${transactionId}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': csrftoken }
            });
            fetchAllData();
        }

        async function loadTransactions() {
            const res = await fetch(apiBase + "transactions/");
            const transactions = await res.json();
            const tbody = document.querySelector("#transactions-table tbody");
            let rowsHtml = transactions.map(tx => {
                const categoryName = tx.category ? tx.category.name : 'Uncategorized';
                return `
                    <tr>
                        <td>${tx.date}</td>
                        <td>${tx.description}</td>
                        <td>₹${parseFloat(tx.amount).toFixed(2)}</td>
                        <td>${categoryName}</td>
                        <td>${tx.is_income ? "Income" : "Expense"}</td>
                        <td><button class="delete-btn" data-id="${tx.id}">Delete</button></td>
                    </tr>
                `;
            }).join('');
            tbody.innerHTML = rowsHtml;
        }

        async function loadSummary() {
            const res = await fetch(apiBase + "summary/");
            const data = await res.json();
            document.getElementById("summary").innerHTML = `
                Income: ₹${data.total_income.toFixed(2)} <br>
                Expense: ₹${data.total_expense.toFixed(2)} <br>
                Savings: ₹${data.savings.toFixed(2)} <br>
                Biggest Expense: ${data.biggest_expense_category}
            `;
        }
        
        async function loadCharts() {
            const res = await fetch(apiBase + "transactions/");
            const transactions = await res.json();
            const expenses = transactions.filter(t => !t.is_income);
            const groupedByCategory = expenses.reduce((acc, tx) => {
                const categoryName = tx.category ? tx.category.name : 'Uncategorized';
                acc[categoryName] = (acc[categoryName] || 0) + parseFloat(tx.amount);
                return acc;
            }, {});

            if (pieChartInstance) pieChartInstance.destroy();
            pieChartInstance = new Chart(document.getElementById("pieChart"), {
                type: "pie",
                data: {
                    labels: Object.keys(groupedByCategory),
                    datasets: [{ data: Object.values(groupedByCategory) }]
                }
            });

            const groupedByMonth = expenses.reduce((acc, tx) => {
                const month = tx.date.slice(0, 7);
                acc[month] = (acc[month] || 0) + parseFloat(tx.amount);
                return acc;
            }, {});

            if (lineChartInstance) lineChartInstance.destroy();
            lineChartInstance = new Chart(document.getElementById("lineChart"), {
                type: "line",
                data: {
                    labels: Object.keys(groupedByMonth).sort(),
                    datasets: [{ label: "Expenses", data: Object.values(groupedByMonth) }]
                }
            });
        }

        document.getElementById("transaction-form").addEventListener("submit", async e => {
            e.preventDefault();
            const form = e.target;
            const txData = {
                description: document.getElementById("description").value,
                amount: document.getElementById("amount").value,
                category_id: document.getElementById("category_id").value,
                is_income: document.getElementById("is_income").value === "true"
            };
            await fetch(apiBase + "transactions/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": csrftoken },
                body: JSON.stringify(txData)
            });
            fetchAllData();
            form.reset();
        });

        document.querySelector("#transactions-table").addEventListener('click', event => {
            if (event.target.classList.contains('delete-btn')) {
                deleteTransaction(event.target.dataset.id);
            }
        });

        function fetchAllData() {
            loadCategories();
            loadSummary();
            loadTransactions();
            loadCharts();
        }

        fetchAllData();
    });
    </script>
</body>
</html>
